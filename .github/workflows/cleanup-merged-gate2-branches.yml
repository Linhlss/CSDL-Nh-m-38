name: One-time cleanup of merged Gate 2 branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-merged-gate2-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'Linhlss/CSDL-Nh-m-38'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only branch heads already reachable from main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          for branch in 'TVTV2TUANNGOC' 'tv3/gate2-w2-t3' 'fix/tv1-integration-gate2'; do
            echo "Checking $branch"
            git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
            tip=$(git rev-parse "refs/remotes/origin/${branch}")
            if ! git merge-base --is-ancestor "$tip" refs/remotes/origin/main; then
              echo "::error::Not deleting ${branch}: its head is not an ancestor of main"
              exit 1
            fi
            server_tip=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq .object.sha)
            if [ "$tip" != "$server_tip" ]; then
              echo "::error::Not deleting ${branch}: remote branch moved during check"
              exit 1
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "::notice::Deleted merged branch ${branch} at ${tip}"
          done
